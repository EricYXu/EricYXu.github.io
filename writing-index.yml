# Rebuilds writing/posts.json whenever a Markdown file in writing/posts/ changes,
# so publishing a piece is just: add the .md file, commit, push.
name: Rebuild writing index

on:
  push:
    paths:
      - 'writing/posts/**'
      - 'writing/build_index.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 writing/build_index.py
      - name: Commit posts.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add writing/posts.json
          git diff --cached --quiet || git commit -m "Rebuild writing index"
          git push
